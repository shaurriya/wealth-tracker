name: Automated Market Scanner & Recommendations

on:
  schedule:
    # Runs Monday to Friday at 03:00 UTC (8:30 AM IST - 45 mins before market open)
    - cron: '0 3 * * 1-5'
  workflow_dispatch: # Allows manual 1-click trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  scan-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install yfinance pandas

      - name: Run Market Scanner
        run: |
          python scanner.py

      - name: Commit & Push Updated Recommendations Feed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add recommendations.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-refresh market recommendations [$(date -u)]" && git push)
